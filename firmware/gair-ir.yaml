# GAir AC IR controller — production firmware
# 16 buttons using transmit_raw with bit-perfect captures from the physical remote.
#
# DOCS: https://github.com/<your-fork>/gair-ac-esp32c3/blob/main/docs/02-the-fix.md
# LICENSE: MIT
#
# To use:
# 1. Set up `secrets.yaml` with: wifi_ssid, wifi_password, api_encryption_key, ota_password, fallback_ap_password
# 2. Adjust `wifi.use_address` to a fixed IP for OTA flashing (or remove for first flash via USB)
# 3. Pin assignments: GPIO3 = IR LED TX, GPIO4 = IR receiver RX (XIAO ESP32-C3 default)
# 4. Compile + flash:
#      esphome run gair-ir.yaml --device <ESP_IP_OR_/dev/ttyACM0>
#
# Hardware tested: Seeed XIAO ESP32-C3 + 940nm IR LED (with 100Ω current limit + 2N2222 driver) + TSOP38xx receiver
# Firmware: ESPHome 2026.4.3 / esp-idf framework

substitutions:
  name: "gair-ir"
  friendly_name: "GAir IR Controller"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: n
      CONFIG_BT_BLUEDROID_ENABLED: n
      CONFIG_BT_NIMBLE_ENABLED: n
      CONFIG_BT_CONTROLLER_ENABLED: n
      CONFIG_LWIP_IPV6: n

logger:
  baud_rate: 115200
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.100   # ← change to your ESP IP
  power_save_mode: NONE        # critical: prevents WiFi modem-sleep jitter on RMT TX
  ap:
    ssid: "GAir-IR Hotspot"
    password: !secret fallback_ap_password

light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO7
    id: system_led

remote_transmitter:
  id: tx
  pin: GPIO3
  carrier_duty_percent: 50%
  non_blocking: false   # critical: blocking TX prevents WiFi/RMT contention (ESPHome issue #538)

# Receiver kept active for diagnostics; not actively used in production buttons.
remote_receiver:
  id: rcvr
  pin:
    number: GPIO4
    inverted: true
    mode:
      input: true
      pullup: true
  idle: 25ms
  tolerance: 30%

script:
  - id: feedback_visual
    mode: single
    then:
      - light.turn_off: system_led
      - delay: 100ms
      - light.turn_on: system_led

# === IR Buttons (16 total) ===
